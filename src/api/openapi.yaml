openapi: 3.0.3
info:
  title: Household Finance API
  version: "1.0.0"
  description: |
    REST API cho ứng dụng quản lý tài chính hộ gia đình (Go + Gin).
    Xác thực bằng cookie JWT `hf_token` (HttpOnly). Mọi endpoint (trừ login/logout,
    /healthz) yêu cầu đăng nhập và chạy trong phạm vi hộ của người dùng — bản ghi
    ngoài hộ trả về 404.

    **Bọc phản hồi**: thành công `{ "data": ... }` (kèm `paging` khi phân trang);
    lỗi `{ "error": { "code", "message", "field?" } }`.

    **Kiểm tra nhanh sau deploy**: mở `/docs` (trang này), gọi `GET /healthz`,
    hoặc `POST /api/auth/login` với user bất kỳ (401 `INVALID_CREDENTIALS` =
    DB đã kết nối & migrate; 500 = lỗi DB/migrate).
servers:
  - url: https://household-finance-api-4f3n3c6hpa-as.a.run.app
    description: Cloud Run (production)
  - url: http://localhost:8080
    description: Local dev

tags:
  - name: System
    description: Health check & tài liệu
  - name: Auth
    description: Đăng nhập / đăng xuất / phiên
  - name: Categories
    description: Danh mục thu/chi (cây 1 cấp)
  - name: Accounts
    description: Tài khoản + số dư (đọc)
  - name: Transactions
    description: Giao dịch (vòng đời đầy đủ)
  - name: Budgets
    description: Ngân sách (tiến độ & cảnh báo suy ra)
  - name: Overview
    description: Tổng quan (Dashboard) — giá trị suy ra
  - name: Reports
    description: Báo cáo theo khoảng thời gian (đọc)

security:
  - cookieAuth: []

paths:
  /healthz:
    get:
      tags: [System]
      summary: Health check (ping DB) — không cần đăng nhập
      security: []
      responses:
        "200":
          description: OK — app + DB khỏe
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: string, example: ok }
        "503":
          description: DB không kết nối được
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: degraded }
                  db: { type: string, example: down }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập — set cookie JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: alice@dev.local }
                password: { type: string, format: password, example: Password123! }
      responses:
        "200":
          description: Thành công (Set-Cookie hf_token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: "#/components/schemas/User" }
        "401":
          description: Sai email/mật khẩu (INVALID_CREDENTIALS)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất — xóa cookie
      security: []
      responses:
        "204": { description: Đã đăng xuất }

  /api/me:
    get:
      tags: [Auth]
      summary: Hồ sơ người dùng + hộ hiện tại
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: "#/components/schemas/User" }
                      household: { $ref: "#/components/schemas/Household" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Chưa thuộc hộ nào (NO_HOUSEHOLD)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/categories:
    get:
      tags: [Categories]
      summary: Danh sách danh mục (cây gốc + children)
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [INCOME, EXPENSE] } }
        - { name: include_hidden, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CategoryTree" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Categories]
      summary: Tạo danh mục
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string, example: Ăn uống }
                type: { type: string, enum: [INCOME, EXPENSE] }
                icon: { type: string, nullable: true }
                parent_id: { type: string, format: uuid, nullable: true }
                confirm_duplicate: { type: boolean, description: "Gửi true để bỏ qua cảnh báo trùng tên" }
      responses:
        "201":
          description: Đã tạo
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Category" } } } } }
        "422":
          description: "Lỗi nghiệp vụ: NESTING_TOO_DEEP, PARENT_TYPE_MISMATCH, NAME_DUPLICATE_WARNING"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/categories/{id}:
    patch:
      tags: [Categories]
      summary: Sửa danh mục (khóa lạc quan)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_updated_at]
              properties:
                name: { type: string }
                icon: { type: string, nullable: true }
                is_hidden: { type: boolean }
                expected_updated_at: { type: string, format: date-time }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Category" } } } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/Gone" }
        "422": { description: "TYPE_IMMUTABLE, …", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Categories]
      summary: Xóa danh mục (kèm xử lý giao dịch)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [reassign, delete_transactions] }
                target_category_id: { type: string, format: uuid, nullable: true }
                expected_updated_at: { type: string, format: date-time }
      responses:
        "204": { description: Đã xóa }
        "422":
          description: "CATEGORY_HAS_TRANSACTIONS (kèm transaction_count, children_count), REASSIGN_TYPE_MISMATCH"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/Gone" }

  /api/categories/suggest:
    get:
      tags: [Categories]
      summary: Gợi ý danh mục theo mô tả (học từ lịch sử)
      parameters:
        - { name: description, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [INCOME, EXPENSE] } }
      responses:
        "200":
          description: Gợi ý hoặc null
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                    $ref: "#/components/schemas/Suggestion"

  /api/accounts:
    get:
      tags: [Accounts]
      summary: Danh sách tài khoản + số dư (view account_balances)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Account" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/transactions:
    get:
      tags: [Transactions]
      summary: Sổ giao dịch (phân trang + lọc khoảng ngày)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 50, maximum: 100 } }
        - { name: from, in: query, description: "YYYY-MM-DD (inclusive)", schema: { type: string, format: date } }
        - { name: to, in: query, description: "YYYY-MM-DD (inclusive); to<from → 400", schema: { type: string, format: date } }
      responses:
        "200":
          description: OK (mới nhất trước)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
                  paging: { $ref: "#/components/schemas/Paging" }
        "400": { description: from/to sai định dạng hoặc to<from, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      tags: [Transactions]
      summary: Tạo giao dịch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionInput" }
      responses:
        "201": { description: Đã tạo, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Transaction" } } } } } }
        "422":
          description: "AMOUNT_INVALID, CATEGORY_REQUIRED, CATEGORY_TYPE_MISMATCH, ACCOUNT_REQUIRED, ACCOUNT_HOUSEHOLD_MISMATCH, DESCRIPTION_TOO_LONG, FUTURE_DATE_NOT_ALLOWED"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/transactions/{id}:
    get:
      tags: [Transactions]
      summary: Chi tiết giao dịch
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Transaction" } } } } } }
        "404": { $ref: "#/components/responses/Gone" }
    patch:
      tags: [Transactions]
      summary: Sửa giao dịch (khóa lạc quan)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TransactionInput"
                - type: object
                  required: [expected_updated_at]
                  properties:
                    expected_updated_at: { type: string, format: date-time }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Transaction" } } } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/Gone" }
        "422": { description: Lỗi validate (như tạo), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Transactions]
      summary: Xóa giao dịch
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { expected_updated_at: { type: string, format: date-time } } }
      responses:
        "204": { description: Đã xóa }
        "404": { $ref: "#/components/responses/Gone" }

  /api/budgets:
    get:
      tags: [Budgets]
      summary: Danh sách ngân sách (tiến độ + cảnh báo kỳ hiện tại)
      parameters:
        - { name: status, in: query, description: "mặc định ACTIVE; 'all' để xem cả ENDED", schema: { type: string, enum: [ACTIVE, ENDED, all] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Budget" } }
    post:
      tags: [Budgets]
      summary: Tạo ngân sách
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetInput" }
      responses:
        "201": { description: Đã tạo, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Budget" } } } } } }
        "422":
          description: "LIMIT_INVALID, CATEGORY_REQUIRED, CATEGORY_TYPE_MISMATCH, CATEGORY_NOT_ALLOWED_FOR_TOTAL, PERIOD_INVALID, BUDGET_DUPLICATE (kèm existing_budget_id)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/budgets/{id}:
    get:
      tags: [Budgets]
      summary: Chi tiết ngân sách
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Budget" } } } } } }
        "404": { $ref: "#/components/responses/Gone" }
    patch:
      tags: [Budgets]
      summary: Sửa ngân sách (khóa lạc quan)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_updated_at]
              properties:
                limit_amount: { type: integer, format: int64 }
                period_type: { type: string, enum: [MONTHLY, WEEKLY, ONE_TIME] }
                category_id: { type: string, format: uuid, nullable: true }
                start_date: { type: string, format: date, nullable: true }
                end_date: { type: string, format: date, nullable: true }
                expected_updated_at: { type: string, format: date-time }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Budget" } } } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/Gone" }
        "422": { description: Lỗi validate (như tạo), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Budgets]
      summary: Xóa ngân sách
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { expected_updated_at: { type: string, format: date-time } } }
      responses:
        "204": { description: Đã xóa }
        "404": { $ref: "#/components/responses/Gone" }

  /api/overview:
    get:
      tags: [Overview]
      summary: Tổng hợp màn Tổng quan (tài sản ròng, thu/chi tháng, chi theo danh mục, giao dịch gần đây)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OverviewSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/reports/overview:
    get:
      tags: [Reports]
      summary: Báo cáo tổng quan theo khoảng (thu/chi/ròng + phân bổ danh mục + xu hướng)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ReportOverview" } } } } } }
        "400": { description: thiếu/sai from,to hoặc to<from (INVALID_REQUEST), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/reports/category/{id}:
    get:
      tags: [Reports]
      summary: Báo cáo chi tiết một danh mục (tổng + giao dịch + xu hướng)
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/CategoryReport" } } } } } }
        "400": { description: thiếu/sai from,to, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: danh mục ngoài hộ / không tồn tại (RECORD_GONE), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: hf_token

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Chưa đăng nhập / phiên không hợp lệ
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: CONCURRENCY_CONFLICT — bản ghi đã bị sửa (kèm data mới nhất)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Gone:
      description: RECORD_GONE — bản ghi đã bị xóa / ngoài hộ
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: INVALID_CREDENTIALS }
            message: { type: string }
            field: { type: string, nullable: true }
    Paging:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
    Household:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        household_id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [INCOME, EXPENSE] }
        icon: { type: string, nullable: true }
        parent_id: { type: string, format: uuid, nullable: true }
        is_default: { type: boolean }
        is_hidden: { type: boolean }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CategoryTree:
      allOf:
        - $ref: "#/components/schemas/Category"
        - type: object
          properties:
            children: { type: array, items: { $ref: "#/components/schemas/Category" } }
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [CASH, BANK, EWALLET, CREDIT] }
        balance: { type: integer, format: int64, description: "Số dư suy ra từ view account_balances" }
    Suggestion:
      type: object
      properties:
        category_id: { type: string, format: uuid }
        name: { type: string }
    TransactionInput:
      type: object
      required: [amount, type, category_id, account_id]
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        type: { type: string, enum: [INCOME, EXPENSE] }
        category_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        description: { type: string, nullable: true, maxLength: 255 }
        transaction_date: { type: string, format: date-time, description: "mặc định now(); không cho ngày tương lai" }
    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        household_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        amount: { type: integer, format: int64 }
        type: { type: string, enum: [INCOME, EXPENSE] }
        category_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        description: { type: string, nullable: true }
        transaction_date: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        category_name: { type: string }
        account_name: { type: string }
        created_by_name: { type: string }
    BudgetInput:
      type: object
      required: [type, limit_amount, period_type]
      properties:
        type: { type: string, enum: [CATEGORY, TOTAL] }
        category_id: { type: string, format: uuid, nullable: true, description: "bắt buộc khi type=CATEGORY; cấm khi TOTAL" }
        limit_amount: { type: integer, format: int64, minimum: 1 }
        period_type: { type: string, enum: [MONTHLY, WEEKLY, ONE_TIME] }
        start_date: { type: string, format: date, nullable: true, description: "bắt buộc cho ONE_TIME" }
        end_date: { type: string, format: date, nullable: true, description: "bắt buộc cho ONE_TIME; ≥ start_date" }
    BudgetAlert:
      type: object
      properties:
        level: { type: string, enum: [THRESHOLD_80, OVER_100] }
        over_amount: { type: integer, format: int64, nullable: true }
        fired_at: { type: string, format: date-time }
    Budget:
      type: object
      properties:
        id: { type: string, format: uuid }
        household_id: { type: string, format: uuid }
        type: { type: string, enum: [CATEGORY, TOTAL] }
        category_id: { type: string, format: uuid, nullable: true }
        category_name: { type: string, nullable: true }
        category_hidden: { type: boolean, nullable: true }
        limit_amount: { type: integer, format: int64 }
        period_type: { type: string, enum: [MONTHLY, WEEKLY, ONE_TIME] }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [ACTIVE, ENDED] }
        period_key: { type: string, description: "khóa kỳ hiện tại (suy ra)" }
        spent: { type: integer, format: int64, description: "đã chi kỳ hiện tại (suy ra)" }
        percent: { type: number, description: "spent/limit (suy ra)" }
        alerts: { type: array, items: { $ref: "#/components/schemas/BudgetAlert" } }
        created_by: { type: string, format: uuid }
        created_by_name: { type: string }
        updated_at: { type: string, format: date-time }
    MonthCashflow:
      type: object
      properties:
        income: { type: integer, format: int64 }
        expense: { type: integer, format: int64 }
        net: { type: integer, format: int64 }
    CategorySpending:
      type: object
      properties:
        category_id: { type: string, format: uuid }
        category_name: { type: string }
