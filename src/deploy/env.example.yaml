# Cloud Run env — copy file này thành deploy/env.yaml rồi điền giá trị THẬT.
# deploy/env.yaml chứa bí mật → đã .gitignore, KHÔNG commit.
# Dùng bởi: gcloud run deploy ... --env-vars-file deploy/env.yaml

# ── Supabase Postgres (app runtime dùng POOLER, serverless-friendly) ──────────
# Session pooler (KHUYẾN NGHỊ — hỗ trợ prepared statement, không cần chỉnh code):
#   postgres://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
# Nếu buộc dùng Transaction pooler (cổng 6543) → thêm DB_PREFER_SIMPLE_PROTOCOL: "true"
DATABASE_URL: "postgres://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require"

# ── JWT ──────────────────────────────────────────────────────────────────────
# Chuỗi ngẫu nhiên đủ dài, ví dụ tạo bằng: openssl rand -base64 48
JWT_SECRET: "<đổi-thành-chuỗi-ngẫu-nhiên-dài>"

# ── CORS + cookie cho web tách origin (Vercel) ───────────────────────────────
# Đổi sang domain Vercel thật (thêm localhost cho dev nếu muốn test chéo).
CORS_ORIGINS: "https://<your-app>.vercel.app,http://localhost:5173"
COOKIE_SECURE: "true"
COOKIE_SAMESITE: "none"
# COOKIE_DOMAIN: ".example.com"   # chỉ đặt khi web & API chung domain gốc (xem docs)

# ── (tùy chọn) tinh chỉnh DB pool — mặc định 10/5, thường không cần ──────────
# DB_MAX_OPEN_CONNS: "10"
# DB_MAX_IDLE_CONNS: "5"
# DB_PREFER_SIMPLE_PROTOCOL: "false"
